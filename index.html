<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knull Cricket Ground - LIVE</title>
    <style>
        body {
            background-color: #2e7d32; 
            background-image: radial-gradient(circle, #388e3c 20%, #1b5e20 80%);
            font-family: sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            overflow: hidden;
        }
        .scoreboard {
            background-color: #121212;
            width: 420px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            text-align: center;
            border: 3px solid #fbc02d;
        }
        .player-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #fbc02d;
            object-fit: cover;
            margin-bottom: 15px;
        }
        #runs {
            font-size: 4.5rem;
            font-weight: 900;
            color: #fbc02d;
        }
        #victory-message {
            display: none;
            background-color: #fbc02d;
            color: #000;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="scoreboard">
    <div style="font-weight:bold; color:#fbc02d; margin-bottom:20px;">KNULL TEAM • LIVE</div>
    
    <img src="viratt.jpg" alt="Virat Kohli" class="player-img">
    
    <h2 style="margin:0;">Virat Kohli</h2>
    
    <div style="background:#1a1a1a; padding:20px; border-radius:15px; margin:20px 0;">
        <span id="runs">97</span><span style="font-size:2.5rem; color:#666;">/4</span>
    </div>

    <p style="font-style:italic; color:#888;">Pressure builds... stuck on 97.</p>

    <div id="victory-message">
        KING KOHLI REIGNS SUPREME! 👑
        <code id="flag-display" style="display:block; margin-top:10px; background:#000; color:#0f0; padding:10px;"></code>
    </div>
</div>

<script>
    (function() {
        let _kS = 97;
        const _fG = "PSNACET{V1r4t_1s_g04t_u_kn0w}";

        setInterval(() => {
            document.getElementById('runs').innerText = _kS;
            if (_kS >= 100) {
                document.getElementById('flag-display').innerText = _fG;
                document.getElementById('victory-message').style.display = "block";
            }
        }, 1000);
    })();
</script>

</body>
</html>
