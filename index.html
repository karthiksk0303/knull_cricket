<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knull Cricket Ground - LIVE</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #000;
        }

        /* The Background Image Setup */
        .bg-image {
            position: fixed;
            left: 0;
            right: 0;
            z-index: -1;
            display: block;
            background-image: url('virat.jpg'); /* Your uploaded photo */
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(5px) brightness(0.4); /* Makes the scoreboard pop */
            transform: scale(1.1); /* Prevents white edges from blur */
        }

        .scoreboard {
            background-color: rgba(18, 18, 18, 0.9); /* Slight transparency */
            width: 420px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            text-align: center;
            border: 3px solid #fbc02d;
            backdrop-filter: blur(10px);
        }

        .header {
            font-size: 1.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
            color: #fbc02d;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }

        .player-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #fbc02d;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(251, 192, 45, 0.4);
        }

        .score-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 25px;
            border-radius: 15px;
            margin: 20px 0;
            border: 1px solid #333;
        }

        #runs {
            font-size: 4.5rem;
            font-weight: 900;
            color: #fbc02d;
            text-shadow: 0 0 10px rgba(251, 192, 45, 0.5);
        }

        .wickets {
            font-size: 2.5rem;
            color: #888;
        }

        #victory-message {
            display: none;
            background-color: #fbc02d;
            color: #000;
            padding: 20px;
            border-radius: 12px;
            font-weight: bold;
            margin-top: 20px;
        }

        code {
            display: block;
            margin-top: 10px;
            background: #000;
            color: #00ff00;
            padding: 10px;
            font-family: monospace;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="bg-image"></div>

<div class="scoreboard">
    <div class="header">KNULL TEAM • LIVE</div>
    
    <img src="viratt.jpg" alt="Virat Kohli" class="player-img">
    
    <h2 style="margin:0; color: white;">Virat Kohli</h2>
    <p style="margin:5px 0; color:#aaa; font-size:0.9rem;">IND vs AUS (Test Series)</p>

    <div class="score-box">
        <span id="runs">97</span><span class="wickets">/4</span>
    </div>

    <p id="commentary" style="color:#888; font-style:italic;">Can he reach the milestone?</p>

    <div id="victory-message">
        KING KOHLI REIGNS SUPREME! 👑
        <code id="flag-display"></code>
    </div>
</div>

<script>
    (function() {
        let _kS = 97;
        const _fG = "PSNACET{V1r4t_1s_g04t_u_kn0w}";

        const update = setInterval(() => {
            document.getElementById('runs').innerText = _kS;

            if (_kS >= 100) {
                document.getElementById('flag-display').innerText = _fG;
                document.getElementById('victory-message').style.display = "block";
                document.getElementById('commentary').innerText = "CENTURY COMPLETED!";
                clearInterval(update);
            }
        }, 1000);

        // Security logic for the CTF
        Object.defineProperty(window, 'score', {
            get() { _kS = 0; return "Reset!"; },
            set(val) { _kS = 0; }
        });
    })();
</script>

</body>
</html>
