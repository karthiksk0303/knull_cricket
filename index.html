<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knull Cricket Ground - LIVE</title>
    <style>
        body, html { height: 100%; margin: 0; font-family: sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden; background-color: #2e7d32; }
        .bg-image { 
            position: fixed; left: 0; right: 0; z-index: -1; display: block; 
            background-image: url('viratt.jpg'); 
            width: 100%; height: 100%; background-size: cover; background-position: center; 
            filter: blur(8px) brightness(0.3); transform: scale(1.1); 
        }
        .scoreboard { background-color: rgba(18, 18, 18, 0.9); width: 420px; padding: 35px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.9); text-align: center; border: 3px solid #fbc02d; backdrop-filter: blur(10px); }
        .player-img { width: 150px; height: 150px; border-radius: 50%; border: 4px solid #fbc02d; object-fit: cover; margin-bottom: 15px; }
        #runs { font-size: 4.5rem; font-weight: 900; color: #fbc02d; }
        #victory-message { display: none; background-color: #fbc02d; color: #000; padding: 20px; border-radius: 12px; margin-top: 20px; font-weight: bold; }
        code { display: block; margin-top: 10px; background: #000; color: #00ff00; padding: 10px; border-radius: 5px; min-height: 20px; }
    </style>
</head>
<body>
<div class="bg-image"></div>
<div class="scoreboard">
    <div style="font-weight:900; color:#fbc02d; letter-spacing:2px; margin-bottom:20px;">KNULL TEAM • LIVE</div>
    <img src="viratt.jpg" alt="Virat Kohli" class="player-img">
    <h2 style="margin:0; color:white;">Virat Kohli</h2>
    <div style="background:rgba(0,0,0,0.6); padding:25px; border-radius:15px; margin:20px 0; border:1px solid #333;">
        <span id="runs">97</span><span style="font-size:2.5rem; color:#666;">/4</span>
    </div>
    <p id="commentary" style="color:#888; font-style:italic;">Analyzing stadium data...</p>
    <div id="victory-message">
        KING KOHLI REIGNS SUPREME! 👑
        <code id="flag-display"></code>
    </div>
</div>

<script>
    (function() {
        let _s = 97;
        
        // The flag is stored as decimal character codes. 
        // No text software or "View Source" can read this as a flag.
        const _p = [80, 83, 78, 65, 67, 69, 84, 123, 86, 49, 114, 52, 116, 95, 49, 115, 95, 103, 48, 52, 116, 95, 117, 95, 107, 110, 48, 119, 125];

        const _t = setInterval(() => {
            document.getElementById('runs').innerText = _s;

            if (_s === 100) {
                // The flag only "exists" for the millisecond it is rendered here
                let _f = _p.map(x => String.fromCharCode(x)).join('');
                document.getElementById('flag-display').innerText = _f;
                document.getElementById('victory-message').style.display = "block";
                document.getElementById('commentary').innerText = "CENTURY!";
                clearInterval(_t);
            }
        }, 1000);

        // Anti-Cheat: Resets if they try to use simple console commands
        window.score = "Locked";
    })();
</script>
</body>
</html>
